<!-- Modal para Configuración AD/DB -->
<div class="modal fade" id="configModal" tabindex="-1" aria-labelledby="configModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content console-panel" style="border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);">
            <div class="modal-header" style="border-bottom: 1px solid var(--border-color); background: var(--table-header-bg);">
                <h5 class="modal-title font-display fw-bold" id="configModalLabel" style="font-size: 1.05rem; color: var(--text-color);"><i class="bi bi-gear-fill text-primary me-2"></i> Ajustes Globales del Sistema</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body p-4" style="color: var(--text-color);">
                <form id="configForm" onsubmit="saveConfig(event)">
                    <!-- Token CSRF explícito para peticiones POST manuales en caso de usar form -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <!-- Active Directory Settings -->
                    <div class="p-4 mb-4" style="background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px;">
                        <h4 style="font-weight: 600; margin-bottom: 20px; font-size: 1.1rem; color: var(--text-color); font-family: var(--font-display);">
                            <i class="bi bi-microsoft text-primary me-2"></i> Integración Active Directory
                        </h4>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="AD_SERVER" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Servidor AD (IP o Hostname)</label>
                                    <input type="text" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="AD_SERVER" name="AD_SERVER" placeholder="ej. 10.15.0.62 o ldap://10.15.0.62">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="AD_BASE_DN" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Base DN (Ruta de Búsqueda)</label>
                                    <input type="text" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="AD_BASE_DN" name="AD_BASE_DN" placeholder="ej. DC=poderjudicial,DC=local">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="AD_SYNC_USER" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Usuario de Sincronización</label>
                                    <input type="text" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="AD_SYNC_USER" name="AD_SYNC_USER" placeholder="ej. gmurad">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="AD_SYNC_PASSWORD" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Contraseña de Sincronización</label>
                                    <input type="password" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="AD_SYNC_PASSWORD" name="AD_SYNC_PASSWORD" placeholder="********">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- MySQL Database Settings -->
                    <div class="p-4 mb-3" style="background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px;">
                        <h4 style="font-weight: 600; margin-bottom: 20px; font-size: 1.1rem; color: var(--text-color); font-family: var(--font-display);">
                            <i class="bi bi-database text-success me-2"></i> Conexión a Base de Datos (MySQL)
                        </h4>
                        
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <div class="form-group mb-3">
                                    <label for="DB_HOST" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Host de Base de Datos</label>
                                    <input type="text" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="DB_HOST" name="DB_HOST" placeholder="ej. 127.0.0.1 o 10.15.2.251">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group mb-3">
                                    <label for="DB_PORT" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Puerto</label>
                                    <input type="text" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="DB_PORT" name="DB_PORT" placeholder="3306">
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-12">
                                <div class="form-group mb-3">
                                    <label for="DB_NAME" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Nombre de la Base de Datos</label>
                                    <input type="text" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="DB_NAME" name="DB_NAME" placeholder="ej. inventario_prod">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="DB_USER" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Usuario de Base de Datos</label>
                                    <input type="text" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="DB_USER" name="DB_USER" placeholder="ej. root">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="DB_PASSWORD" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Contraseña de Base de Datos</label>
                                    <input type="password" class="form-control" style="background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); font-family: var(--font-mono); font-size: 0.85rem;" id="DB_PASSWORD" name="DB_PASSWORD" placeholder="********">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
                <div id="configErrorMsg" class="alert alert-danger d-none" style="background: rgba(220, 38, 38, 0.15); border: 1px solid #ef4444; color: #f87171;"></div>
            </div>
            <div class="modal-footer" style="border-top: 1px solid var(--border-color); background: var(--table-header-bg);">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" style="font-family: var(--font-mono); font-size: 0.85rem;">[ CANCELAR ]</button>
                <button type="button" class="btn btn-outline-primary" id="btnTestAd" onclick="testAdConnection()" style="border-radius: 8px; font-weight: 600;">
                    <i class="bi bi-plug"></i> Probar Conexión AD
                </button>
                <button type="button" class="btn btn-primary" id="btnSave" onclick="saveConfig(event)" style="border-radius: 8px; font-weight: 600;">
                    <i class="bi bi-check-circle-fill"></i> Guardar Cambios
                </button>
            </div>
        </div>
    </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', () => {
    const configModalEl = document.getElementById('configModal');
    if(configModalEl) {
        configModalEl.addEventListener('show.bs.modal', async () => {
            try {
                const response = await fetch("{{ url_for('setup.config_api_get') }}");
                if (response.ok) {
                    const result = await response.json();
                    if (result.status === 'success') {
                        const data = result.data;
                        if(data.AD_SERVER) document.getElementById('AD_SERVER').value = data.AD_SERVER;
                        if(data.AD_BASE_DN) document.getElementById('AD_BASE_DN').value = data.AD_BASE_DN;
                        if(data.AD_SYNC_USER) document.getElementById('AD_SYNC_USER').value = data.AD_SYNC_USER;
                        if(data.AD_SYNC_PASSWORD) document.getElementById('AD_SYNC_PASSWORD').value = data.AD_SYNC_PASSWORD;

                        if(data.DB_HOST) document.getElementById('DB_HOST').value = data.DB_HOST;
                        if(data.DB_PORT) document.getElementById('DB_PORT').value = data.DB_PORT;
                        if(data.DB_NAME) document.getElementById('DB_NAME').value = data.DB_NAME;
                        if(data.DB_USER) document.getElementById('DB_USER').value = data.DB_USER;
                        if(data.DB_PASSWORD) document.getElementById('DB_PASSWORD').value = data.DB_PASSWORD;
                    }
                }
            } catch (err) {
                console.error("Error cargando config:", err);
            }
        });
    }
});


async function testAdConnection() {
    const btn = document.getElementById('btnTestAd');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Probando...';
    btn.disabled = true;
    
    const form = document.getElementById('configForm');
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    try {
        const response = await fetch("{{ url_for('setup.test_ad_connection') }}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        if(response.ok) {
            const result = await response.json();
            if(result.status === 'success') {
                alert('✅ ÉXITO: ' + result.message);
            } else {
                alert('❌ ERROR: ' + result.message);
            }
        } else {
            alert('❌ ERROR: Fallo en la comunicación con el servidor.');
        }
    } catch(err) {
        console.error(err);
        alert('❌ ERROR: Fallo de red.');
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}

async function saveConfig(event) {
    event.preventDefault();
    
    const btn = document.getElementById('btnSave');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Guardando...';
    btn.disabled = true;
    
    const form = document.getElementById('configForm');
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    try {
        const response = await fetch("{{ url_for('setup.save_config') }}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        if(response.ok) {
            const result = await response.json();
            if(result.status === 'success') {
                alert('✅ Configuración guardada correctamente.');
                const modal = bootstrap.Modal.getInstance(document.getElementById('configModal'));
                if(modal) modal.hide();
            } else {
                alert('Error al guardar: ' + result.message);
            }
        } else {
            alert('Error en el servidor.');
        }
    } catch(err) {
        console.error(err);
        alert('Error de conexión.');
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}
</script>
<style>
@keyframes spin { 100% { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 1s linear infinite; }
</style>
