<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Caído - Inventario</title>
    <!-- CSS en línea para evitar dependencias locales rotas si la app entera falla -->
    <style>
        body { background-color: #121212; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .container { text-align: center; max-width: 600px; padding: 40px; border: 1px solid #333; border-radius: 12px; background: #1e1e1e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { margin: 0 0 15px 0; font-size: 28px; }
        p { color: #a0a0a0; font-size: 16px; line-height: 1.5; margin-bottom: 30px; }
        .btn { display: inline-block; background-color: #3b82f6; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background-color: #2563eb; }
        .footer { margin-top: 40px; font-size: 12px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔥</div>
        <h1>Sistema Fuera de Servicio</h1>
        <p>El Sistema de Inventario no puede procesar solicitudes en este momento debido a una interrupción crítica del servidor (Gunicorn/Flask no responde).</p>
        <p>El equipo de infraestructura ha sido notificado.</p>
        
        <a href="/" class="btn">Reintentar Conexión</a>
        
        <div class="footer">
            Error 502 Bad Gateway - NGINX fallback page
        </div>
    </div>
</body>
</html>
