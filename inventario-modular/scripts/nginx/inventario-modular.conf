# Configuracion de Reverse Proxy Nginx para Inventario Modular (Spring Boot en 127.0.0.1:8081)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Redireccion permanente de HTTP (80) a HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name _ serverinventario 10.15.2.251;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS (443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _ serverinventario 10.15.2.251;

    # Certificados SSL / TLS (autofirmado institucional o emitido por CA)
    ssl_certificate /etc/ssl/certs/inventario-modular.crt;
    ssl_certificate_key /etc/ssl/private/inventario-modular.key;

    # Protocolos seguros y cifrados recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras defensivas para uso intranet via HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Tamano maximo de subida para reportes y exportaciones
    client_max_body_size 50M;

    # Proxy hacia el monolito Spring Boot
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Cabeceras requeridas para Spring Security y ForwardedHeaderFilter
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Soporte WebSocket / SSE si aplica
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts de conexion
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
