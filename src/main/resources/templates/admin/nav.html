<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="topbar(eyebrow, title, activeModule)" class="panel-header">
	<div class="panel-topbar">
		<div class="panel-branding">
			<p class="eyebrow" th:text="${eyebrow}">Modulo</p>
			<h1 id="panel-title" th:text="${title}">Titulo</h1>
		</div>
		<div class="user-session-pill" title="Sesión activa">
			<div class="user-avatar" aria-hidden="true">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
					<circle cx="12" cy="7" r="4"></circle>
				</svg>
			</div>
			<div class="user-meta">
				<span class="user-name" th:text="${displayName != null and !displayName.isEmpty() ? displayName : (username != null and !username.isEmpty() ? username : 'Usuario')}">Usuario</span>
				<span class="user-subtext">
					<span class="user-account" th:text="'@' + ${username != null and !username.isEmpty() ? username : 'local'}">@usuario</span>
					<span class="user-badge" th:if="${fuero != null and !#strings.isEmpty(fuero)}" th:text="${fuero}">Fuero</span>
				</span>
			</div>
			<form class="logout-form" th:action="@{/logout}" method="post">
				<button type="submit" class="logout-pill-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
						<polyline points="16 17 21 12 16 7"></polyline>
						<line x1="21" y1="12" x2="9" y2="12"></line>
					</svg>
					<span>Salir</span>
				</button>
			</form>
		</div>
	</div>
	<nav class="admin-actions admin-nav-bar" aria-label="Navegación principal">
		<a class="nav-tab" th:classappend="${activeModule == 'panel'} ? ' is-active' : ''" th:href="@{/admin}">Panel</a>
		<a class="nav-tab" th:if="${canViewEquipos != null ? canViewEquipos : true}" th:classappend="${activeModule == 'equipos'} ? ' is-active' : ''" th:href="@{/admin/equipos}">Equipos</a>
		<a class="nav-tab" th:if="${canViewOrdenesArmado != null ? canViewOrdenesArmado : true}" th:classappend="${activeModule == 'ordenes'} ? ' is-active' : ''" th:href="@{/admin/ordenes-armado}">Ordenes</a>
		<a class="nav-tab" th:if="${canViewStock != null ? canViewStock : true}" th:classappend="${activeModule == 'stock'} ? ' is-active' : ''" th:href="@{/admin/stock}">Stock</a>
		<a class="nav-tab" th:if="${canViewDashboardDiferencias != null ? canViewDashboardDiferencias : true}" th:classappend="${activeModule == 'diferencias'} ? ' is-active' : ''" th:href="@{/admin/dashboard-diferencias}">Diferencias</a>
		<a class="nav-tab" th:if="${canViewMuebles != null ? canViewMuebles : true}" th:classappend="${activeModule == 'muebles'} ? ' is-active' : ''" th:href="@{/admin/muebles}">Muebles</a>
		<a class="nav-tab" th:if="${canViewUbicaciones != null ? canViewUbicaciones : true}" th:classappend="${activeModule == 'ubicaciones'} ? ' is-active' : ''" th:href="@{/admin/ubicaciones}">Ubicaciones</a>
		<a class="nav-tab" th:if="${canViewPatrimonio != null ? canViewPatrimonio : true}" th:classappend="${activeModule == 'patrimonio'} ? ' is-active' : ''" th:href="@{/admin/patrimonio}">Patrimonio</a>
		<a class="nav-tab" th:if="${canViewActas != null ? canViewActas : true}" th:classappend="${activeModule == 'actas'} ? ' is-active' : ''" th:href="@{/admin/actas}">Actas</a>
		<a class="nav-tab" th:if="${canViewReportes != null ? canViewReportes : true}" th:classappend="${activeModule == 'reportes'} ? ' is-active' : ''" th:href="@{/admin/reportes}">Reportes</a>
		<a class="nav-tab" th:if="${canViewTareas != null ? canViewTareas : true}" th:classappend="${activeModule == 'tareas'} ? ' is-active' : ''" th:href="@{/admin/tareas}">Tareas</a>
		<a class="nav-tab" th:if="${canViewAuditoria != null ? canViewAuditoria : true}" th:classappend="${activeModule == 'auditoria'} ? ' is-active' : ''" th:href="@{/admin/auditoria}">Auditoria</a>
		<a class="nav-tab" th:if="${canManageUsers != null ? canManageUsers : true}" th:classappend="${activeModule == 'usuarios'} ? ' is-active' : ''" th:href="@{/admin/usuarios}">Usuarios</a>
	</nav>
</header>

</body>
</html>
