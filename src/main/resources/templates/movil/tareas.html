<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#13745c">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title>Tareas | Inventario Modular</title>
    <link rel="stylesheet" th:href="@{/css/movil.css}">
    <script defer th:src="@{/js/lucide.min.js}"></script>
    <script defer th:src="@{/js/movil-tareas.js}"></script>
</head>
<body th:attr="data-base=@{/}">
    <header class="mobile-header">
        <div><span class="brand">INVENTARIO MODULAR</span><h1>Tareas</h1></div>
        <div class="header-actions">
            <a id="download-apk" th:if="${apkDisponible}" class="icon-button" th:href="@{/api/v1/movil/apk}" aria-label="Descargar APK de prueba" title="Descargar APK de prueba"><i data-lucide="smartphone"></i></a>
            <button id="sound" class="icon-button" type="button" aria-label="Activar sonido en esta pantalla" title="Activar sonido en esta pantalla" aria-pressed="false"><i data-lucide="bell-off"></i></button>
            <form th:action="@{/logout}" method="post"><button class="icon-button" title="Cerrar sesion" aria-label="Cerrar sesion"><i data-lucide="log-out"></i></button></form>
        </div>
    </header>
    <main class="mobile-main">
        <div class="session-line"><span id="username">Cargando usuario...</span><span id="connection" role="status">Conectando...</span></div>
        <section class="metrics" aria-label="Resumen de tareas">
            <div><strong id="pending-count">0</strong><span>Pendientes</span></div>
            <div><strong id="mine-count">0</strong><span>A mi cargo</span></div>
            <div><strong id="done-count">0</strong><span>Realizadas hoy</span></div>
        </section>
        <div class="list-tools">
            <label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="Buscar tarea, equipo o usuario" aria-label="Buscar tarea, equipo o usuario"></label>
            <button id="new-task" class="primary" type="button" hidden><i data-lucide="plus"></i><span>Nueva tarea</span></button>
            <button id="refresh" class="icon-button" title="Actualizar" aria-label="Actualizar"><i data-lucide="refresh-cw"></i></button>
        </div>
        <nav class="filters" aria-label="Filtrar tareas">
            <button data-filter="pending" aria-pressed="true">Pendientes</button>
            <button data-filter="mine" aria-pressed="false">Mis tareas</button>
            <button data-filter="done" aria-pressed="false">Finalizadas</button>
            <button data-filter="all" aria-pressed="false">Todas</button>
        </nav>
        <p id="message" class="message" role="status" hidden></p>
        <div class="list-heading"><h2 id="list-title">Pendientes</h2><span id="result-count" class="muted"></span></div>
        <section id="task-list" aria-labelledby="list-title" aria-busy="true"></section>
        <p id="empty" class="empty" hidden>No hay tareas para este filtro.</p>
        <button id="more" class="secondary" hidden>Ver mas tareas</button>
    </main>

    <dialog id="detail-dialog" aria-labelledby="detail-title">
        <header class="dialog-header"><h2 id="detail-title">Tarea</h2><button class="icon-button" data-close="detail-dialog" aria-label="Cerrar detalle" title="Cerrar"><i data-lucide="x"></i></button></header>
        <div class="dialog-body">
            <p id="detail-status" class="muted"></p>
            <p id="detail-description" class="preserve-lines"></p>
            <dl id="detail-meta"></dl>
            <div class="detail-actions">
                <button id="take-task" class="primary">Tomar tarea</button>
                <button id="edit-task" class="secondary"><i data-lucide="pencil"></i>Editar</button>
                <button id="delete-task" class="icon-button danger" title="Eliminar tarea" aria-label="Eliminar tarea"><i data-lucide="trash-2"></i></button>
            </div>
            <form id="state-form">
                <h3>Estado</h3>
                <label>Estado de la tarea<select name="estado"><option value="PENDIENTE">Pendiente</option><option value="CERRADA">Finalizada</option><option value="CANCELADA">Cancelada</option></select></label>
                <label>Resultado u observaciones<textarea name="observacionesCierre" rows="2" maxlength="1000"></textarea></label>
                <button type="submit" class="primary">Guardar estado</button>
            </form>
            <h3>Comentarios</h3>
            <div id="comments"></div>
            <form id="comment-form">
                <label>Nuevo comentario<textarea name="comentario" rows="2" maxlength="1000" required></textarea></label>
                <button class="secondary" type="submit"><i data-lucide="send"></i>Comentar</button>
            </form>
            <p id="detail-message" class="message" role="status" hidden></p>
        </div>
    </dialog>

    <dialog id="task-dialog" aria-labelledby="form-title">
        <header class="dialog-header"><h2 id="form-title">Nueva tarea</h2><button class="icon-button" data-close="task-dialog" aria-label="Cerrar formulario" title="Cerrar"><i data-lucide="x"></i></button></header>
        <form id="task-form" class="dialog-body">
            <label>Titulo<input name="titulo" maxlength="180" required></label>
            <label>Descripcion<textarea name="descripcion" maxlength="1000" rows="3"></textarea></label>
            <label>Prioridad<select name="prioridad"><option value="BAJA">Baja</option><option value="MEDIA" selected>Media</option><option value="ALTA">Alta</option><option value="URGENTE">Urgente</option></select></label>
            <label>Usuario solicitante
                <input id="solicitante-username-input" name="solicitanteUsername" maxlength="120" required
                       list="solicitante-options" autocomplete="off" autocapitalize="none" spellcheck="false">
                <datalist id="solicitante-options"></datalist>
                <small id="solicitante-help" class="field-help">Escriba al menos 2 caracteres para buscar en AD.</small>
            </label>
            <label>Nombre del solicitante<input name="solicitanteNombre" maxlength="180" required></label>
            <label>Fuero u oficina<input name="solicitanteFuero" maxlength="120" required></label>
            <label id="responsable-field">Responsable<input name="responsable" maxlength="120" placeholder="Sin tomar" autocapitalize="none"></label>
            <p id="form-message" class="message error" role="alert" hidden></p>
            <button class="primary" type="submit">Guardar tarea</button>
        </form>
    </dialog>
</body>
</html>
