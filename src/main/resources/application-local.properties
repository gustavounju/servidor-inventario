server.port=${INVENTARIO_SERVER_PORT:8081}
server.forward-headers-strategy=framework

inventario.version=${INVENTARIO_VERSION:0.0.1-SNAPSHOT}

# MySQL dinamico: trabajo/laboratorio remoto y fallback local de casa.
# La base remota del sistema modular esta separada del servidor de aplicacion.
inventario.datasource.primary.url=${INVENTARIO_DB_PRIMARY_URL:${INVENTARIO_DB_URL:jdbc:mysql://10.15.0.62:3306/inventario_modular}}
inventario.datasource.primary.username=${INVENTARIO_DB_PRIMARY_USER:${INVENTARIO_DB_USER:inventario_modular_app}}
inventario.datasource.primary.password=${INVENTARIO_DB_PRIMARY_PASSWORD:${INVENTARIO_DB_PASSWORD:}}

inventario.datasource.fallback.url=${INVENTARIO_DB_FALLBACK_URL:jdbc:mysql://127.0.0.1:3306/inventario_modular}
inventario.datasource.fallback.username=${INVENTARIO_DB_FALLBACK_USER:inventario_local}
inventario.datasource.fallback.password=${INVENTARIO_DB_FALLBACK_PASSWORD:Cambiar_Clave_Local_123!}

inventario.datasource.timeout-ms=${INVENTARIO_DB_TIMEOUT_MS:1500}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.flyway.enabled=false

inventario.ldap.enabled=${INVENTARIO_LDAP_ENABLED:false}
inventario.ldap.url=${INVENTARIO_LDAP_URL:ldap://SERVIDOR_AD:389}
inventario.ldap.domain=${INVENTARIO_LDAP_DOMAIN:DOMINIO}
inventario.ldap.base-dn=${INVENTARIO_LDAP_BASE_DN:DC=ejemplo,DC=local}
inventario.ldap.display-name-attribute=${INVENTARIO_LDAP_DISPLAY_NAME_ATTRIBUTE:displayName}
inventario.ldap.fuero-attribute=${INVENTARIO_LDAP_FUERO_ATTRIBUTE:department}
inventario.ldap.read-only-user-dn=${INVENTARIO_LDAP_READ_ONLY_USER_DN:}
inventario.ldap.read-only-password=${INVENTARIO_LDAP_READ_ONLY_PASSWORD:}
inventario.ldap.user-search-base=${INVENTARIO_LDAP_USER_SEARCH_BASE:}
inventario.ldap.user-search-filter=${INVENTARIO_LDAP_USER_SEARCH_FILTER:(&(objectClass=user)(!(objectClass=computer)))}
inventario.ldap.user-search-limit=${INVENTARIO_LDAP_USER_SEARCH_LIMIT:50}

inventario.local-auth.enabled=${INVENTARIO_LOCAL_AUTH_ENABLED:true}
inventario.local-auth.username=${INVENTARIO_LOCAL_AUTH_USERNAME:admin.local}
inventario.local-auth.password=${INVENTARIO_LOCAL_AUTH_PASSWORD:AdminLocal123}
inventario.local-auth.display-name=${INVENTARIO_LOCAL_AUTH_DISPLAY_NAME:Administrador Local}
inventario.local-auth.fuero=${INVENTARIO_LOCAL_AUTH_FUERO:Desarrollo local}
inventario.local-db-auth.enabled=${INVENTARIO_LOCAL_DB_AUTH_ENABLED:true}
inventario.security.report-token=${INVENTARIO_REPORT_TOKEN:dev-token-123456}
